include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
  errors:
    # Freezed/json_serializable annotations on factory constructors.
    invalid_annotation_target: ignore

linter:
  rules:
    # This is an app, not a published package.
    public_member_api_docs: false
    # Dependencies are grouped by purpose in pubspec.yaml.
    sort_pub_dependencies: false
    # Notifier methods like `select(mode)` read better than setters.
    use_setters_to_change_properties: false
    # Newer syntax lints that code generators (freezed) don't support yet.
    unnecessary_type_name_in_constructor: false
    unnecessary_const_in_enum_constructor: false

plugins:
  riverpod_lint: ^3.1.9
