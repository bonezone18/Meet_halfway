name: meet_halfway
description: "Find a fair place to meet halfway between two (or more) people."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Data & models
  collection: ^1.19.1
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Platform integrations
  cupertino_icons: ^1.0.8
  geolocator: ^14.1.2
  google_maps_flutter: ^2.19.0
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.2
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
